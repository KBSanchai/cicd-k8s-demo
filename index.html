<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My E-Commerce Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
    }

    header {
      background: #0a66c2;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: white;
      width: 260px;
      margin: 15px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      overflow: hidden;
      transition: transform 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .card-content {
      padding: 15px;
      text-align: center;
    }

    .price {
      color: green;
      font-size: 18px;
      font-weight: bold;
    }

    button {
      background: #0a66c2;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }

    button:hover {
      background: #004182;
    }

    footer {
      background: #333;
      color: white;
      text-align: center;
      padding: 10px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<header>
  🛒 My Online Store
</header>

<div class="container">

  <div class="card">
    <img src="https://picsum.photos/300/200?1">
    <div class="card-content">
      <h3>Smart Phone</h3>
      <p class="price">$500</p>
      <button onclick="addToCart('Smart Phone')">Add to Cart</button>
    </div>
  </div>

  <div class="card">
    <img src="https://picsum.photos/300/200?2">
    <div class="card-content">
      <h3>Laptop</h3>
      <p class="price">$900</p>
      <button onclick="addToCart('Laptop')">Add to Cart</button>
    </div>
  </div>

  <div class="card">
    <img src="https://picsum.photos/300/200?3">
    <div class="card-content">
      <h3>Headphones</h3>
      <p class="price">$120</p>
      <button onclick="addToCart('Headphones')">Add to Cart</button>
    </div>
  </div>

  <div class="card">
    <img src="https://picsum.photos/300/200?4">
    <div class="card-content">
      <h3>Smart Watch</h3>
      <p class="price">$250</p>
      <button onclick="addToCart('Smart Watch')">Add to Cart</button>
    </div>
  </div>

</div>

<footer>
  © 2026 My E-Commerce Store
</footer>

<script>
function addToCart(item) {
  alert(item + " added to cart 🛒");
}
</script>

</body>
</html>
